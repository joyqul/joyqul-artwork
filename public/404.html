<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 找不到網頁 | 玖伊枯 作品集 (joyqul.tw)</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/webp" href="/assets/joyqul_avatar.webp" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Pure CSS for instantaneous render & zero external script blockages -->
    <style>
      :root {
        --color-bg: #FAF8F5;
        --color-text: #403C35;
        --color-text-muted: #8C8372;
        --color-accent: #C2A978;
        --color-accent-hover: #A68F62;
        --color-card-border: rgba(194, 169, 120, 0.25);
        --font-sans: "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--color-bg);
        color: var(--color-text);
        font-family: var(--font-sans);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      .container {
        max-width: 480px;
        width: 100%;
        text-align: center;
        opacity: 0;
        transform: translateY(12px);
        animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* Logo / Avatar Frame */
      .icon-frame {
        display: inline-flex;
        padding: 4px;
        border: 1px solid rgba(194, 169, 120, 0.6);
        border-radius: 50%;
        margin-bottom: 2rem;
        position: relative;
      }

      .icon-inner {
        padding: 4px;
        border: 2px solid var(--color-accent);
        border-radius: 50%;
        overflow: hidden;
        width: 80px;
        height: 80px;
        background: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: inset 0 2px 4px rgba(0,0,0,0.03);
      }

      .icon-inner img {
        width: 100%;
        height: 100%;
        object-cover: cover;
        border-radius: 50%;
      }

      /* 404 Muted Badge */
      .status-badge {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: var(--color-accent);
        background-color: rgba(194, 169, 120, 0.08);
        border: 1px solid rgba(194, 169, 120, 0.15);
        padding: 4px 12px;
        border-radius: 4px;
        display: inline-block;
        margin-bottom: 1.25rem;
      }

      /* Title & Description */
      .title {
        font-family: Georgia, "Playfair Display", "Noto Serif CJK TC", serif;
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #33302B;
        margin-bottom: 0.75rem;
        line-height: 1.3;
      }

      .description {
        font-size: 0.875rem;
        color: var(--color-text-muted);
        line-height: 1.6;
        margin-bottom: 2.5rem;
        font-weight: 500;
      }

      /* Redirect / Info container if URL is matching a comic id */
      .recovery-notice {
        display: none;
        background: rgba(255, 255, 255, 0.6);
        border: 1px dashed var(--color-card-border);
        border-radius: 12px;
        padding: 1rem;
        margin-bottom: 2rem;
        font-size: 0.8125rem;
        color: var(--color-text);
        text-align: left;
        align-items: center;
        gap: 0.75rem;
        animation: fadeIn 0.4s ease-out forwards;
      }

      .recovery-spinner {
        width: 16px;
        height: 16px;
        border: 2px solid rgba(194, 169, 120, 0.2);
        border-top-color: var(--color-accent);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        flex-shrink: 0;
      }

      /* Styled primary CTA button */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background-color: transparent;
        color: var(--color-accent);
        border: 1px solid rgba(194, 169, 120, 0.4);
        padding: 0.75rem 1.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 50px;
        text-decoration: none;
        transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        cursor: pointer;
      }

      .btn:hover {
        background-color: rgba(194, 169, 120, 0.08);
        border-color: var(--color-accent);
        transform: translateY(-1px);
        box-shadow: 0 4px 12px rgba(194, 169, 120, 0.08);
      }

      .btn:active {
        transform: translateY(0);
        background-color: rgba(194, 169, 120, 0.12);
      }

      .btn svg {
        transition: transform 0.2s ease;
      }

      .btn:hover svg {
        transform: translateX(-3px);
      }

      /* Footer copyright */
      .footer {
        position: absolute;
        bottom: 2rem;
        font-size: 10px;
        font-family: inherit;
        letter-spacing: 0.05em;
        color: #A69C8E;
      }

      /* Animations */
      @keyframes fadeUp {
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes fadeIn {
        to {
          opacity: 1;
        }
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>

    <script>
      // Intelligent fallback routing behavior for Single-Page App (SPA) Hosting
      document.addEventListener("DOMContentLoaded", function() {
        const path = window.location.pathname;
        
        // Match clean comic slugs (e.g., /comic/false_love_signal_manga or without trailing slash)
        const pathMatch = path.match(/\/comic\/([^/]+)/);
        const isQuiz = path.includes('/quiz');
        
        if (pathMatch || isQuiz) {
          const recoverySection = document.getElementById("recovery-notice");
          const ctaBtn = document.getElementById("cta-btn");
          
          if (recoverySection) {
            recoverySection.style.display = "flex";
            ctaBtn.style.display = "none";
          }
          
          let spaTarget = window.location.protocol + '//' + window.location.host;
          if (isQuiz) {
            spaTarget += '/#/quiz';
          } else {
            const comicId = pathMatch[1];
            spaTarget += '/#/comic/' + comicId;
          }
          
          // Redirect to the React index page with correct target hash router pathing after a brief moment
          setTimeout(function() {
            window.location.replace(spaTarget);
          }, 800);
        }
      });
    </script>
  </head>
  <body>
    <div class="container" id="main-container">
      <!-- Minimalist Avatar Portrait Frame -->
      <div class="icon-frame">
        <div class="icon-inner">
          <img src="/assets/joyqul_avatar.webp" alt="玖伊枯 Logo" />
        </div>
      </div>

      <div>
        <div class="status-badge">404 NOT FOUND</div>
        <h1 class="title">《找不到此頁面》</h1>
        
        <!-- Recovery loader (only shown when a valid comic subdirectory pattern triggers) -->
        <div class="recovery-notice" id="recovery-notice">
          <div class="recovery-spinner"></div>
          <div>
            <strong style="display: block; font-weight: 600; margin-bottom: 2px;">正在修復並為您導向...</strong>
            <span style="color: var(--color-text-muted)">正在將您的訪問重定位至對應的作品專頁中。</span>
          </div>
        </div>

        <p class="description">抱歉，您所造訪的網址路徑不存在，或已被移到其他的作品區間。</p>
        
        <!-- Standard Escape Action -->
        <a href="/" class="btn" id="cta-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          <span>返回作品集首頁</span>
        </a>
      </div>
    </div>

    <footer class="footer">
      © 2026 玖伊枯作品集 All rights reserved.
    </footer>
  </body>
</html>
